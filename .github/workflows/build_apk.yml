name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_ORG: com.lupargent
  # プラグイン(ライブラリ)に強制するcompileSdk
  FORCE_COMPILE_SDK: 36

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project exists
        run: |
          if [ ! -d android ]; then
            echo "android/ not found. Generating..."
            cp lib/main.dart /tmp/main.dart.bak
            cp pubspec.yaml /tmp/pubspec.yaml.bak
            flutter create --org "$APP_ORG" --platforms android .
            cp /tmp/main.dart.bak lib/main.dart
            cp /tmp/pubspec.yaml.bak pubspec.yaml
            rm -rf test
          else
            echo "android/ already exists. Skipping generation."
          fi

      - name: Patch AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s//&\n  <uses-permission android:name="android.permission.INTERNET" \/>\n  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>/' "$MANIFEST"
          fi
          if ! grep -q 'scheme="mailto"' "$MANIFEST"; then
            sed -i 's#</manifest>#  <queries>\n    <intent>\n      <action android:name="android.intent.action.SENDTO" />\n      <data android:scheme="mailto" />\n    </intent>\n  </queries>\n</manifest>#' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Set minSdk to 21
        working-directory: android/app
        run: |
          if [ -f build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' build.gradle.kts
          fi
          if [ -f build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' build.gradle
          fi

      - name: Force compileSdk for plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compile-sdk.gradle <<EOF
          allprojects { p ->
            // 各プロジェクトの評価前にafterEvaluateを登録する
            // (AGP自身のafterEvaluateより先に実行させるため)
            p.afterEvaluate {
              if (p.plugins.hasPlugin('com.android.library')) {
                p.android.compileSdkVersion ${FORCE_COMPILE_SDK}
              }
            }
          }
          EOF
          cat ~/.gradle/init.d/force-compile-sdk.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mailrtc-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
