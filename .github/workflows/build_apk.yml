# v2からの差分:
# - Webビルド(flutter build web)を追加し、GitHub Pagesへ自動公開
# - 雛形の自動生成を android と web の両方に対応
# - Pages公開用に permissions へ pages: write と id-token: write を追加
# - deployジョブを追加(buildジョブ完了後に実行)
# (APKのReleases公開、パッケージ名 com.lupargent.flutterapptest は v2 と同じ)

name: Flutter Build APK and Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create scaffold if missing
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create --platforms=android,web --org com.lupargent --project-name flutterapptest .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk flutterapptest-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" \
            "flutterapptest-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}"

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
