# v1からの差分:
# - Artifacts(ZIP)をやめ、GitHub ReleasesにAPKを直接公開(解凍不要)
# - パッケージ名を com.lupargent.flutterapptest に指定
# - Releases作成のため permissions: contents: write を追加

name: Flutter Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.lupargent --project-name flutterapptest .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk flutterapptest-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" \
            "flutterapptest-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}"
